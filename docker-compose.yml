services:
  mosaic:
    build: .
    ports:
      - "127.0.0.1:8000:10000"
    environment:
      PORT: "10000"
      DATABASE_URL: sqlite:////data/mosaic.db
      MOSAIC_PREVIEW_USERNAME: owner
      MOSAIC_PREVIEW_PASSWORD: ${MOSAIC_PREVIEW_PASSWORD:?Set MOSAIC_PREVIEW_PASSWORD in your environment}
    volumes:
      - mosaic-data:/data
    restart: unless-stopped
volumes:
  mosaic-data:

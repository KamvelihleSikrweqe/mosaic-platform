name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install MOSAIC developer package
        run: pip install .
      - name: Smoke-test MOSAIC CLI
        run: mosaic --help
      - name: Smoke-test database migrations
        env:
          DATABASE_URL: sqlite:///./migration_smoke.db
        run: alembic upgrade head
      - name: Run tests
        env:
          MOSAIC_PREVIEW_USERNAME: owner
          MOSAIC_PREVIEW_PASSWORD: ci-only-test-password
        run: pytest -q

      - name: Check browser JavaScript syntax
        run: node --check static/app.js
      - name: Check runtime and Studio JavaScript syntax
        run: node --check static/app-runtime.js && node --check static/app-studio.js
      - name: Compile Python SDK and CLI
        run: python -m compileall -q mosaic mosaic_sdk mosaic_cli.py
      - name: Validate Keycloak realm JSON
        run: python -m json.tool keycloak/realm-mosaic.json > /dev/null

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

      - name: Check browser JavaScript syntax
        run: node --check static/app.js
      - name: Check runtime and Studio JavaScript syntax
        run: node --check static/app-runtime.js && node --check static/app-studio.js
      - name: Compile Python SDK and CLI
        run: python -m compileall -q mosaic mosaic_sdk mosaic_cli.py
      - name: Validate Keycloak realm JSON
        run: python -m json.tool keycloak/realm-mosaic.json > /dev/null

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-platform-sdk"
version = "0.1.0"
description = "Developer client and CLI for MOSAIC programmable business applications"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mosaic = "mosaic_cli:main"

[tool.setuptools]
packages = ["mosaic_sdk"]
py-modules = ["mosaic_cli"]
